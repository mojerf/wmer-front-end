name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Angular 22 needs Node ^22.22.3 || ^24.15.0 || >=26
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - name: Unit tests with coverage
        run: npm test -- --no-watch --coverage --coverage-reporters=lcov --coverage-reporters=text-summary

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/wmer-front-end/lcov.info
          flags: front-end
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - run: npm run build

      - name: Smoke-test the SSR server
        run: |
          PORT=4000 node dist/wmer-front-end/server/server.mjs &
          for i in $(seq 1 20); do curl -fs http://localhost:4000/robots.txt >/dev/null && break; sleep 1; done
          curl -fs http://localhost:4000/about | grep -q "<title>"
          curl -fsI http://localhost:4000/about | grep -i "content-security-policy"
          curl -fs http://localhost:4000/robots.txt | grep -q "Sitemap:"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
